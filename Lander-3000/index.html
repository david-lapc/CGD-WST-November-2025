<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decompressor-3000</title>
    <link type="text/css" rel="stylesheet" href="css/styles.css">
</head>

<body>
    <section class="hero">
        <div class="left">
            <img src="../Decompressor-3000/images/decompressor.png" alt="Decompressor-3000 Image" width="80%">
        </div>
        <div class="right">
            <div class="text-content">
                <h1>Decompressor-3000</h1>
                <h2>Tired of back problems?</h2>
                <p>
                    Take the quiz and find out which <span style="display: inline-block;">Decompressor-3000</span> <span
                        style="display: inline-block;">is
                        right for you!</span>
                </p>
                <button id="start-quiz-btn">
                    Start
                </button>
            </div>
            <div class="quiz-container">

                <div class="counter">
                    Question <span id="current-question">1</span> of <span id="total-questions">5</span>
                </div>

                <!-- Quiz content will go here -->
                <div class="card">
                    <h2 id="question"></h2>
                    <ul id="answers">
                    </ul>
                </div>
            </div>
        </div>
    </section>
    <script src="js/quiz.js">
    </script>
</body>

</html>
