<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nata+Sans:wght@100..900&family=Playwrite+AU+QLD:wght@100..400&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Montserrat", sans-serif;
        }

        header {
            text-align: center;
            background-color: #baddff;
            height: calc(100svh - 8.5em);

            .header-top {
                padding: 20px;
            }

            nav {
                background-color: rgb(30, 24, 59);
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;

                ul {
                    list-style-type: none;

                    li {
                        a {
                            text-decoration: none;
                            font-size: 1.5em;
                            color: #fff;
                            padding: 15px 30px;
                            display: block;
                        }
                    }
                }
            }
        }

        h1 {
            font-family: "Playwrite AU QLD", cursive;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-top">
            <h1>CGD 200, 210, & WST 165</h1>
            <h2>November 2025</h2>
        </div>

        <nav>
            <ul>
                <li><a href="flashcards">Flashcards</a></li>
                <li><a href="zapper-2000">Zapper-2000</a></li>
                <li><a href="Decompressor-3000">Decompressor-3000</a></li>
            </ul>
        </nav>
    </header>

</body>

</html>
